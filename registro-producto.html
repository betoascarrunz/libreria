<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lista y registro de materiales escolares de Analy's Librería.">
    <link rel="stylesheet" href="styles.css">
    <title>Productos | Analy's Librería</title>
</head>

<body class="pagina-dashboard">
    <header class="encabezado-sitio">
        <div class="contenedor contenido-encabezado">
            <a class="marca" href="home.html" aria-label="Analy's, panel principal">
                <span class="marca-simbolo">A</span>
                <span>Analy's<span class="marca-punto">.</span></span>
            </a>
            <nav class="navegacion-principal" aria-label="Navegación del usuario">
                <a href="home.html">Panel</a>
                <a class="activo" href="productos.html" aria-current="page">Productos</a>
                <a href="index.html#categorias">Categorías</a>
            </nav>
            <a class="enlace-login" href="login.html">Cerrar sesión</a>
        </div>
    </header>

    <main class="contenido-dashboard contenido-productos">
        <div class="contenedor">
            <section class="encabezado-productos" aria-labelledby="titulo-productos">
                <div>
                    <p class="etiqueta">Gestión de inventario</p>
                    <h1 id="titulo-productos">Registrar producto</h1>
                    <p>Agrega un nuevo material escolar al inventario de la librería.</p>
                </div>
                <a class="boton" href="productos.html">Volver a productos</a>
            </section>

            <section class="panel-dashboard registro-producto" id="registro-producto" aria-labelledby="titulo-registro">
                <div class="encabezado-panel">
                    <div>
                        <p class="etiqueta">Nuevo registro</p>
                        <h2 id="titulo-registro">Datos del producto</h2>
                    </div>
                </div>

                <form class="formulario-producto" action="productos.html" method="get">
                    <div class="campo-producto campo-producto-nombre">
                        <label for="nombre-producto">Nombre del producto</label>
                        <input type="text" id="nombre-producto" name="nombre"
                            placeholder="Ej. Regla plástica de 30 cm" autocomplete="off" required>
                    </div>

                    <div class="campo-producto">
                        <label for="categoria-producto">Categoría</label>
                        <select id="categoria-producto" name="categoria" required>
                            <option value="">Seleccionar categoría</option>
                            <option>Cuadernos</option>
                            <option>Escritura</option>
                            <option>Pegamentos</option>
                            <option>Arte</option>
                        </select>
                    </div>

                    <div class="campo-producto">
                        <label for="precio-producto">Precio (Bs.)</label>
                        <input type="number" id="precio-producto" name="precio" min="0" step="0.01"
                            placeholder="0.00" required>
                    </div>

                    <div class="campo-producto">
                        <label for="stock-producto">Cantidad en stock</label>
                        <input type="number" id="stock-producto" name="stock" min="0" placeholder="0" required>
                    </div>

                    <div class="acciones-formulario">
                        <button class="boton" type="submit">Guardar producto</button>
                        <button class="boton boton-cancelar" type="reset">Limpiar</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer class="pie-sitio pie-dashboard">
        <div class="contenedor contenido-pie">
            <p class="derechos">© 2026 Analy's Librería. Todos los derechos reservados.</p><a class="enlace-texto"
                href="home.html">Volver al panel</a>
        </div>
    </footer>
</body>

</html>
