<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Inicia sesión en Librería Analy's.">
	<link rel="stylesheet" href="styles.css">
	<title>Iniciar sesión | Analy's Librería</title>
</head>
<body class="pagina-login">
	<header class="encabezado-sitio">
		<div class="contenedor contenido-encabezado">
			<a class="marca" href="index.html" aria-label="Analy's, inicio">
				<span class="marca-simbolo">A</span>
				<span>Analy's<span class="marca-punto">.</span></span>
			</a>
			<nav class="navegacion-principal" aria-label="Navegación principal">
				<a href="index.html">Inicio</a>
				<a href="index.html#catalogo">Catálogo</a>
				<a href="index.html#categorias">Categorías</a>
			</nav>
			<a class="enlace-login activo" href="login.html" aria-current="page">Inicia Sesión</a>
		</div>
	</header>

	<main class="contenido-login">
		<section class="tarjeta-login" aria-labelledby="titulo-login">
			<p class="etiqueta">Bienvenido de nuevo</p>
			<h1 id="titulo-login">Inicia sesión.</h1>
			<p class="descripcion-login">Accede a tu cuenta.</p>

			<form class="formulario-login" action="index.html" method="get">
				<div class="grupo-campo">
					<label for="correo">Correo electrónico</label>
					<input type="email" id="correo" name="correo" autocomplete="email" required>
				</div>

				<div class="grupo-campo">
					<label for="contrasena">Contraseña</label>
					<input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
				</div>

				<div class="opciones-login">
					<label class="recordarme" for="recordar">
						<input type="checkbox" id="recordar" name="recordar">
						<span>Recordarme</span>
					</label>
					<a href="mailto:hola@analy.test?subject=Recuperar%20contraseña">¿Olvidaste tu contraseña?</a>
				</div>

				<button class="boton boton-login" type="submit">Entrar</button>
			</form>

			<p class="registro-login">¿Todavía no tienes una cuenta? <a href="mailto:hola@analy.test?subject=Crear%20una%20cuenta">Regístrate</a></p>
		</section>
	</main>

	<footer class="pie-sitio pie-login">
		<div class="contenedor contenido-pie">
			<p class="derechos">© 2026 Analy's Librería. Todos los derechos reservados.</p>
			<a class="enlace-texto" href="index.html">Volver al inicio</a>
		</div>
	</footer>
</body>
</html>
